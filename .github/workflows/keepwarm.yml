name: Keep warm

# CHỈ CHẠY TAY (từ 29/9/2026): Actions → "Keep warm" → Run workflow, khoảng 1–2
# phút trước buổi demo. Đánh thức cả web lẫn api để giám khảo không gặp lượt
# khởi động nguội 30–60 giây. KHÔNG có lịch tự động — đọc phép tính dưới đây
# trước khi thêm lại.
#
# ── NGÂN SÁCH GIỜ MIỄN PHÍ ─────────────────────────────────────────────────────
# Render cấp 750 giờ instance miễn phí mỗi THÁNG DƯƠNG LỊCH cho CẢ workspace,
# dùng chung cho MỌI web service gói free. Hết giờ thì Render ĐÌNH CHỈ mọi
# service free tới ngày 1 tháng sau (503 "This service has been suspended",
# header x-render-routing: suspend) — không phải ngủ, đánh thức cũng không lên.
# Đã xảy ra: 764/750 giờ, web + api bị đình chỉ ngày 28–29/9/2026.
#
# Hiện api VÀ web đều ở gói free, 0 đồng:
#   Một service thức 24/24:  tháng 31 ngày  24 × 31 = 744 giờ
#                            tháng 30 ngày  24 × 30 = 720 giờ
#   Giữ ấm web 24/24 (744) + giờ api thức khi radar/brief/người dùng gọi
#   (mỗi lần đánh thức giữ máy ≥15 phút; riêng radar 4 lần/ngày ≈ 31 giờ/tháng)
#   → vượt 750 giờ ngay trong tháng 31 ngày → đình chỉ lại.
# Vì vậy KHÔNG giữ ấm tự động service nào. Để radar.yml (6 giờ/lần) và
# brief.yml tự đánh thức api khi cần; web thức khi có người vào.
#
# Muốn bật lại lịch: chỉ khi CHỈ CÒN MỘT service free trong workspace (service
# kia đã trả phí), và tính lại tổng giờ — kể cả service free của dự án khác.
#
# Lịch GitHub cũng không đáng tin: đo 10–29/9/2026, lịch "*/10" chỉ chạy 3–8
# lần/ngày (khoảng cách trung vị 2,5–6 giờ), không phải 144 lần.

on:
  workflow_dispatch: {}

concurrency:
  group: keepwarm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Đánh thức api + web
        run: |
          fail=0
          for url in \
            "https://terratwin-api.onrender.com/api/health" \
            "https://terratwin-web.onrender.com/" ; do
            echo "→ $url"
            # --retry-all-errors để thử lại cả khi gặp 503 lúc service đang dậy;
            # tổng thời gian chờ đủ để một service nguội khởi động xong (~60s).
            if curl -fsS --max-time 90 --retry 6 --retry-delay 20 \
                 --retry-all-errors "$url" -o /dev/null ; then
              echo "  ok — đã thức"
            else
              echo "::error::$url hỏng sau khi thử lại hết — service chết hoặc bị đình chỉ (hết giờ miễn phí?)."
              fail=1
            fi
          done
          exit $fail
