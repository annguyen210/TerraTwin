name: E2E production (chỉ đọc) + Lighthouse

# GĐ1 kế hoạch tổng: kiểm thử giao diện tự động trong CI. Chạy trên PRODUCTION ở chế độ CHỈ ĐỌC
# (--readonly: không phát hành hồ sơ — sổ minh bạch không xoá được) mỗi ngày và khi bấm tay.
# Không chạy trên mỗi push: deploy chỉ lên SAU khi CI xanh, nên chạy ngay lúc push là đo bản cũ.

on:
  schedule:
    - cron: "45 1 * * *"     # 08:45 sáng giờ VN
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-prod
  cancel-in-progress: true

env:
  WEB: https://terratwin-web.onrender.com
  API: https://terratwin-api.onrender.com

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.48,<2"
      - name: Đánh thức web + api (gói miễn phí ngủ sau 15 phút)
        run: |
          for u in "$API/api/health" "$WEB/help"; do
            for i in 1 2 3 4 5 6; do curl -fsS -o /dev/null --max-time 60 "$u" && break; sleep 20; done
          done
      - name: Luồng chính (chỉ đọc)
        run: python ops/e2e_browser.py "$WEB" "$API" --readonly
      - name: Song ngữ VI/EN trên điện thoại
        run: python ops/e2e_lang.py "$WEB"

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Đánh thức web
        run: for i in 1 2 3 4 5 6; do curl -fsS -o /dev/null --max-time 60 "$WEB/" && break; sleep 20; done
      - uses: actions/checkout@v5
      - name: Lighthouse điện thoại (hiệu năng, truy cập) — trung vị 3 lần mỗi trang
        run: |
          set -e
          fail=0
          for path in / /eudr /help; do
            files=""
            for i in 1 2 3; do
              npx -y lighthouse@12 "$WEB$path" --quiet --only-categories=performance,accessibility                 --form-factor=mobile --screenEmulation.mobile --output=json --output-path="lh-$i.json"                 --chrome-flags="--headless=new --no-sandbox" && files="$files lh-$i.json" || echo "::warning::Lighthouse lỗi ở $path (lần $i)"
            done
            [ -n "$files" ] || continue
            read -r perf a11y rest <<< "$(node ops/lh/median.cjs $files)"
            echo "::notice::Lighthouse $path — hiệu năng trung vị $perf (mục tiêu ≥85, chỉ báo cáo) · truy cập $a11y (lần tệ nhất; cổng cứng ≥95) · $rest"
            [ "$perf" -ge 85 ] || echo "::warning::Lighthouse $path — hiệu năng trung vị $perf dưới mục tiêu 85 (xem lại nếu lặp lại nhiều ngày)"
            [ "$a11y" -ge 95 ] || fail=1
            rm -f lh-*.json
          done
          # Hiệu năng trên gói miễn phí dao động theo máy chủ ngủ/dậy → chỉ báo cáo (trung vị 3 lần); truy cập là cổng cứng.
          [ "$fail" = "0" ]

  zap:
    # GĐ7 — OWASP ZAP baseline: quét THỤ ĐỘNG (chỉ đọc, không tấn công) trang web và API production.
    # Cổng cứng: các quy tắc FAIL trong .zap/rules.tsv (thiếu header bảo vệ cơ bản, lộ X-Powered-By, CORS
    # sai, cookie thiếu cờ). Cảnh báo còn lại vào báo cáo tải về được.
    name: OWASP ZAP baseline (thụ động)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Đánh thức web + api (chờ tới khi trả 200 THẬT)
        # 19/10/2026: lượt 8:45 quét lúc API còn ngủ → Render trả trang chờ 503 (của Render, không có HSTS) →
        # ZAP báo "thiếu HSTS" giả. Trước đây chỉ thử ~2 phút rồi lặng lẽ đi tiếp; giờ chờ tối đa ~8 phút.
        run: |
          for u in "$API/api/health" "$WEB/help"; do
            ok=0
            for i in $(seq 1 24); do curl -fsS -o /dev/null --max-time 60 "$u" && { ok=1; break; }; sleep 20; done
            [ "$ok" = "1" ] || echo "::warning::$u chưa thức sau ~8 phút"
          done
      - name: ZAP baseline — web + api
        run: |
          chmod a+w .
          fail=0
          for target in "$WEB" "$API/api/health"; do
            # quét web mất vài phút — kiểm lại API còn thức ngay trước khi quét, để không chấm trang chờ của Render
            for i in $(seq 1 12); do curl -fsS -o /dev/null --max-time 60 "$target" && break; sleep 15; done
            name=$(echo "$target" | sed 's#https://##; s#[/.]#-#g')
            docker run --rm -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py               -t "$target" -m 2 -I -c .zap/rules.tsv -r "zap-$name.html" -J "zap-$name.json" || ec=$?
            ec=${ec:-0}
            case "$ec" in 0) kq="ĐẠT — không quy tắc FAIL nào";; 1) kq="CÓ quy tắc FAIL";; 3) kq="LỖI CHẠY (không quét trọn)";; *) kq="mã lạ";; esac
            echo "::notice::ZAP $target — $kq (mã thoát $ec; báo cáo đầy đủ trong zap-reports)"
            [ "$ec" = "1" ] && fail=1
            [ "$ec" = "3" ] && echo "::warning::ZAP không chạy trọn được với $target"
            unset ec
          done
          [ "$fail" = "0" ]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-reports
          path: zap-*.*
          if-no-files-found: ignore
