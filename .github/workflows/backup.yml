name: Database backup

# N2 → SỬA SAU KIỂM TOÁN: pg_dump Postgres mỗi ngày, MÃ HOÁ (gpg AES256), đẩy
# vào một REPO RIÊNG TƯ khác — KHÔNG còn đẩy vào nhánh `backups` của chính
# repo công khai này nữa.
#
# VÌ SAO ĐỔI. Mã hoá GPG chỉ trễ việc đọc được, không cứu được việc PHÁT TÁN.
# Nhánh `backups` của một repo công khai là công khai — ai `git clone` cũng
# tải được các bản .sql.gz.gpg đó VĨNH VIỄN, kể cả sau khi ta xoá nhánh (đã
# clone thì họ giữ bản riêng). Một bản sao lưu chứa email + hash mật khẩu +
# toạ độ thửa của người dùng thật không được phép nằm trong tầm với đó, dù có
# mã hoá hay không — bài toán ở đây là NGƯỜI LẠ CÓ TẢI ĐƯỢC FILE hay không,
# GPG chỉ trả lời được câu "tải được rồi thì đọc được không".
#
# NGUỒN SAO LƯU (29/9/2026 — chuyển CSDL sang Neon, xem migrate-neon.yml):
# workflow TỰ CHỌN — Neon đã có bảng thì sao lưu Neon (CSDL đang sống sau khi
# chuyển), chưa có thì sao lưu Render (trước khi chuyển). Không phải sửa secret
# đúng lúc chuyển giao; sau khi Render xoá CSDL cũ (9/10/2026) vẫn chạy tiếp.
#
# BẮT BUỘC đặt các secret trong repo Settings → Secrets → Actions:
#   TERRATWIN_NEON_URL          — URL Neon loại DIRECT (host không có "-pooler").
#   TERRATWIN_DB_EXTERNAL_URL   — External Database URL của Render (Postgres →
#                                 Connect → External). Chỉ cần tới khi chuyển
#                                 xong; có MỘT trong hai URL này là đủ chạy.
#   TERRATWIN_BACKUP_PASSPHRASE — chuỗi ngẫu nhiên dài, sinh một lần và CẤT GIỮ
#                                 an toàn ngoài repo (mất chuỗi này = mất khả
#                                 năng đọc mọi bản sao lưu cũ).
#   TERRATWIN_BACKUP_REPO       — "chủ-sở-hữu/tên-repo" của repo RIÊNG TƯ dùng
#                                 riêng để chứa sao lưu (vd "annguyen210/
#                                 terratwin-backups"). Tạo repo này TRƯỚC, để
#                                 Private, không cần file nào bên trong.
#   TERRATWIN_BACKUP_REPO_PAT   — fine-grained Personal Access Token CHỈ cấp
#                                 quyền cho ĐÚNG repo TERRATWIN_BACKUP_REPO ở
#                                 trên, quyền Contents: Read and write. Tạo ở
#                                 GitHub → Settings (tài khoản) → Developer
#                                 settings → Fine-grained tokens. KHÔNG cấp
#                                 quyền cho repo TerraTwin công khai này.
#
# Giữ 7 bản ngày + 4 bản tuần (ops/backup.sh tự xoay vòng, xoá bản cũ trước
# khi commit — repo sao lưu không phình vô hạn).

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 02:00 sáng hôm sau giờ VN (UTC+7)
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

# KHÔNG cần contents:write cho repo NÀY nữa — sao lưu đẩy sang repo khác bằng
# PAT riêng, không dùng GITHUB_TOKEN của repo công khai này để ghi bất cứ đâu.
permissions:
  contents: read

jobs:
  backup:
    # Ghim 24.04: ubuntu-latest chuyển sang Ubuntu 26 từ 19/10/2026, mà kho PGDG
    # có thể chưa có gói cho tên bản phát hành mới ngay hôm đó.
    runs-on: ubuntu-24.04
    env:
      PG_CLIENT_MAJOR: "18"     # = bản chính CSDL Render; Neon cùng bản hoặc cũ hơn
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm secret bắt buộc
        run: |
          fail=0
          if [ -z "${{ secrets.TERRATWIN_NEON_URL }}" ] && [ -z "${{ secrets.TERRATWIN_DB_EXTERNAL_URL }}" ]; then
            echo "::error::Thiếu cả TERRATWIN_NEON_URL lẫn TERRATWIN_DB_EXTERNAL_URL — không có CSDL nào để sao lưu."
            fail=1
          fi
          if [ -z "${{ secrets.TERRATWIN_BACKUP_PASSPHRASE }}" ]; then
            echo "::error::Thiếu secret TERRATWIN_BACKUP_PASSPHRASE — KHÔNG được sao lưu chưa mã hoá."
            fail=1
          fi
          if [ -z "${{ secrets.TERRATWIN_BACKUP_REPO }}" ]; then
            echo "::error::Thiếu secret TERRATWIN_BACKUP_REPO — cần repo RIÊNG TƯ để chứa sao lưu, không được đẩy vào repo công khai này."
            fail=1
          fi
          if [ -z "${{ secrets.TERRATWIN_BACKUP_REPO_PAT }}" ]; then
            echo "::error::Thiếu secret TERRATWIN_BACKUP_REPO_PAT — token ghi vào TERRATWIN_BACKUP_REPO."
            fail=1
          fi
          [ "$fail" = "0" ]

      # KHÔNG dùng postgresql-client của Ubuntu (bản 16): CSDL là PostgreSQL 18,
      # pg_dump cũ hơn máy chủ sẽ dừng với "server version mismatch".
      - name: Cài pg_dump ${{ env.PG_CLIENT_MAJOR }} (kho PGDG)
        run: bash ops/install-pg-client.sh "$PG_CLIENT_MAJOR"

      - name: Chọn CSDL cần sao lưu (Neon nếu đã có bảng, không thì Render)
        id: src
        env:
          NEON_URL: ${{ secrets.TERRATWIN_NEON_URL }}
          RENDER_URL: ${{ secrets.TERRATWIN_DB_EXTERNAL_URL }}
        run: |
          tables=0
          if [ -n "$NEON_URL" ]; then
            tables=$(psql "$NEON_URL" -X -tAc               "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'") || tables=0
          fi
          if [ "${tables:-0}" -gt 0 ]; then
            src=neon; url="$NEON_URL"
          elif [ -n "$RENDER_URL" ]; then
            src=render; url="$RENDER_URL"
          else
            echo "::error::Neon chưa có bảng nào và không có TERRATWIN_DB_EXTERNAL_URL — chưa có gì để sao lưu."
            exit 1
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"
          srv=$(psql "$url" -X -tAc "SELECT current_setting('server_version_num')::int / 10000")
          echo "Sao lưu từ: $src (PostgreSQL $srv, bảng public ở Neon: $tables)"
          if [ "$srv" -gt "$PG_CLIENT_MAJOR" ]; then
            echo "::error::Máy chủ PostgreSQL $srv mới hơn pg_dump $PG_CLIENT_MAJOR — nâng PG_CLIENT_MAJOR."
            exit 1
          fi

      - name: Chuẩn bị repo sao lưu RIÊNG TƯ (checkout nếu có, tạo mới nếu chưa)
        run: |
          git config --global user.name "terratwin-backup-bot"
          git config --global user.email "actions@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.TERRATWIN_BACKUP_REPO_PAT }}@github.com/${{ secrets.TERRATWIN_BACKUP_REPO }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" main >/dev/null 2>&1; then
            git clone --branch main --single-branch --depth 1 "$REMOTE" ../backups-wt
          else
            mkdir -p ../backups-wt
            git -C ../backups-wt init -q -b main
            git -C ../backups-wt commit -q --allow-empty -m "khoi tao repo sao luu"
          fi

      - name: Sao lưu + mã hoá (ops/backup.sh)
        env:
          TERRATWIN_DATABASE_URL: ${{ steps.src.outputs.src == 'neon' && secrets.TERRATWIN_NEON_URL || secrets.TERRATWIN_DB_EXTERNAL_URL }}
          TERRATWIN_BACKUP_PASSPHRASE: ${{ secrets.TERRATWIN_BACKUP_PASSPHRASE }}
          TERRATWIN_BACKUP_DIR: ${{ github.workspace }}/../backups-wt
        run: bash ops/backup.sh

      - name: Commit + đẩy bản sao lưu đã mã hoá vào repo RIÊNG TƯ
        run: |
          cd ../backups-wt
          git add -A
          if git diff --cached --quiet; then
            echo "Không có gì mới (đã có bản hôm nay?)."
          else
            git commit -q -m "backup $(date -u +%Y%m%d-%H%M)Z"
            git push -q "https://x-access-token:${{ secrets.TERRATWIN_BACKUP_REPO_PAT }}@github.com/${{ secrets.TERRATWIN_BACKUP_REPO }}.git" main
          fi
