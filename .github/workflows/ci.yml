name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Test gọi API thật thi thoảng hụt do mạng — tự chạy lại, không phải lỗi code.
      # Ghi tóm tắt lỗi vào job summary (đọc được không cần quyền admin log).
      - name: pytest
        run: |
          set +e
          pytest --reruns 2 --reruns-delay 5 -q --tb=line 2>&1 | tee /tmp/pt.log
          code=${PIPESTATUS[0]}
          # Phát tên test hỏng thành annotation (::error::) — đọc được qua
          # check-runs annotations API mà không cần quyền admin log.
          grep -E "^(FAILED|ERROR) " /tmp/pt.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E "[0-9]+ (failed|error|passed)" /tmp/pt.log | tail -1 | while IFS= read -r line; do
            echo "::error::SUMMARY $line"
          done
          exit $code

  backend-postgres:
    name: Backend — pytest trên PostgreSQL
    # Đ7 — mã Đợt 1 (đặt lại mật khẩu, xoá tài khoản, cột env, _deduped_counts,
    # cache sổ điểm) CHƯA từng chạy trên Postgres. Deploy dùng Postgres, và đúng
    # loại lỗi này (DATETIME, DDL, SQL riêng của Postgres) chỉ lộ ở đó. Chạy
    # ĐÚNG bộ test hiện có trên Postgres để bắt trước khi lên production.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terratwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TERRATWIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/terratwin_test
      TERRATWIN_SECRET: ci-fixed-secret-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt "psycopg[binary]"
      - run: pytest --reruns 2 --reruns-delay 5    # CÙNG bộ test, trên PostgreSQL

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
