name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Test gọi API thật thi thoảng hụt do mạng — tự chạy lại, không phải lỗi code.
      - run: pytest --reruns 2 --reruns-delay 5

  backend-postgres:
    name: Backend — pytest trên PostgreSQL
    # Đ7 — mã Đợt 1 (đặt lại mật khẩu, xoá tài khoản, cột env, _deduped_counts,
    # cache sổ điểm) CHƯA từng chạy trên Postgres. Deploy dùng Postgres, và đúng
    # loại lỗi này (DATETIME, DDL, SQL riêng của Postgres) chỉ lộ ở đó. Chạy
    # ĐÚNG bộ test hiện có trên Postgres để bắt trước khi lên production.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terratwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TERRATWIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/terratwin_test
      TERRATWIN_SECRET: ci-fixed-secret-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt "psycopg[binary]"
      - run: pytest --reruns 2 --reruns-delay 5    # CÙNG bộ test, trên PostgreSQL

  ops-db:
    name: Ops — chuyển CSDL, đối chiếu, cron đánh thức api
    # Kiểm THẬT ops/install-pg-client.sh (kho PGDG), ops/migrate-neon.sh và
    # ops/db-reconcile.sh — ba thứ chỉ chạy trên dữ liệu thật, nên lỗi ở đây
    # chỉ lộ ra đúng lúc đang chuyển CSDL production. PostgreSQL 18 = bản Render.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt "psycopg[binary]"
      - run: bash ops/install-pg-client.sh 18 "$PG_ADMIN_URL"
      - run: bash ops/ci-test-migrate.sh
      # Script cron của radar.yml/brief.yml: đánh thức api ngủ, nhận ra bị
      # đình chỉ, quét nền + hỏi tiến độ trên backend thật.
      - run: bash ops/ci-test-cron.sh

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  security:
    name: Bảo mật — lỗ hổng thư viện đã công bố
    # Phần mềm giữ chữ ký số, tài khoản và sổ minh bạch: thư viện có lỗ hổng đã công bố
    # (PyJWT, Pillow, Starlette — 40 mã lỗ hổng, vá 10/2026) phải làm CI đỏ ngay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
