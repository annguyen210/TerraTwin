[pytest]
pythonpath = .
testpaths = tests
addopts = -q
markers =
    mat_nuoc_that: dùng region.inland_water thật (WorldCover/radar giả lập trong test)
    goi_overpass_that: cho phép gọi Overpass thật
    do_thi_that: dùng water_history.urban thật (WorldCover giả lập trong test)
    mua_lu_that: dùng flood_season.season thật (ERA5 giả lập trong test)
