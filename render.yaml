# Deploy TerraTwin lên Render — https://render.com
#
# Cách dùng:
#   1. Đẩy repo này lên GitHub.
#   2. Render → New → Blueprint → chọn repo. Render đọc file này và dựng
#      backend + frontend. CSDL KHÔNG nằm ở Render — xem mục CSDL dưới đây.
#   3. Sau khi dựng xong, mở service `terratwin-api` → Environment và đặt
#      TERRATWIN_DATABASE_URL (URL Neon), TERRATWIN_CORS (URL frontend Render
#      cấp cho bạn).
#
# TERRATWIN_SECRET được Render sinh ngẫu nhiên và giữ cố định — KHÔNG đặt tay,
# nếu đổi thì mọi người dùng bị đăng xuất.
#
# CSDL (29/9/2026): Postgres ở NEON gói miễn phí, không ở Render. Postgres free
# của Render hết hạn 30 ngày sau khi tạo, thêm 14 ngày ân hạn rồi bị XOÁ cả dữ
# liệu (terratwin-db cũ: xoá ngày 9/10/2026). Neon free không có hạn xoá.
# KHÔNG thêm lại khối `databases:` hay `fromDatabase` — đồng bộ Blueprint (tự
# chạy mỗi lần push) sẽ ghi đè URL Neon bằng một CSDL free 30 ngày mới. Gỡ một
# tài nguyên khỏi file này KHÔNG xoá nó trên Render, chỉ tách khỏi Blueprint.
#
# GÓI: api và web đều free, 0 đồng. Cả workspace có 750 giờ free/tháng dùng
# chung; KHÔNG giữ ấm tự động (xem .github/workflows/keepwarm.yml). Cả hai ngủ
# sau 15 phút không có request; radar.yml và brief.yml tự đánh thức api.

services:
  - type: web
    name: terratwin-api
    runtime: python
    plan: free
    rootDir: backend
    # onnxruntime cài sẵn ở đây, KHÔNG phải để dùng ngay. Nếu bạn huấn luyện
    # mô hình lớp phủ trên máy có GPU rồi chép landcover.onnx lên, máy chủ phải
    # có sẵn thư viện đọc nó — nếu không, lớp học sâu IM LẶNG trả None và bạn
    # mất 4-8 tiếng huấn luyện mà không biết vì sao model không được dùng.
    # Chưa có tệp .onnx thì thư viện này chỉ nằm im, không ảnh hưởng gì.
    buildCommand: pip install -r requirements.txt psycopg[binary]==3.2.3 onnxruntime
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Ghim Python 3.12 (đúng bản CI test). Mặc định Render nhảy lên 3.14, mà
      # pydantic-core 2.23.4 chưa có wheel cho 3.14 → pip phải biên dịch bằng
      # Rust và chết vì cargo cache read-only. 3.12 có sẵn wheel cho mọi gói.
      - key: PYTHON_VERSION
        value: "3.12.7"
      # URL Neon loại DIRECT (host không có "-pooler"), giữ nguyên đuôi
      # ?sslmode=require. Đặt tay trên Render, không để Blueprint quản lý — xem
      # mục CSDL ở đầu file. Quên đặt thì app rơi về SQLite trên đĩa tạm (mất
      # dữ liệu mỗi lần khởi động lại): /api/health → database.kind báo ngay.
      - key: TERRATWIN_DATABASE_URL
        sync: false
      - key: TERRATWIN_SECRET
        generateValue: true          # sinh một lần, giữ cố định
      - key: TERRATWIN_TOKEN_HOURS
        value: "72"
      - key: TERRATWIN_RATE_LIMIT
        value: "120"
      - key: TERRATWIN_TRUST_PROXY
        value: "1"                   # BẮT BUỘC: Render đứng sau proxy
      # Production → cảnh báo thật vào sổ điểm công khai. Máy dev đặt "dev" trong
      # .env để cảnh báo thử không lẫn vào tỉ lệ báo bừa.
      - key: TERRATWIN_ENV
        value: "prod"
      # C05 Rà soát chủ động tự chạy trong tiến trình, vì gói free của Render
      # KHÔNG có cron. Đặt 0 nếu bạn chạy nhiều worker hoặc đã có cron ngoài
      # gọi POST /api/radar/run (nhiều worker = mỗi worker quét một lần).
      - key: TERRATWIN_RADAR_INTERVAL_H
        value: "6"
      # Trần lượt gọi RA NGOÀI cùng lúc. Đây là thứ đứng giữa phần mềm và việc
      # bị Open-Meteo chặn IP — đừng nâng chỉ vì thấy chậm.
      - key: TERRATWIN_UPSTREAM_CONCURRENCY
        value: "6"
      - key: TERRATWIN_WORKERS
        value: "4"
      # Chống lạm dụng khóa API, chưa phải tính tiền: một khóa bị lộ mà không
      # có trần sẽ đốt hết hạn mức ngày của Open-Meteo và MỌI người dùng mất
      # dữ liệu theo. 0 = không giới hạn.
      - key: TERRATWIN_KEY_MONTHLY_QUOTA
        value: "5000"
      # M4 — khoá cho cron gọi POST /api/brief/run (workflow brief.yml). Đặt CÙNG
      # giá trị trong GitHub Secrets tên TERRATWIN_CRON_KEY. Tự sinh chuỗi ngẫu
      # nhiên, giữ bí mật — ai có nó gọi được endpoint gửi bản tin.
      - key: TERRATWIN_CRON_KEY
        sync: false
      # M1 — Web Push. Cặp VAPID tự sinh (py_vapid). Đặt CẢ HAI; frontend tự lấy
      # khoá công khai qua /api/push/key nên KHÔNG cần biến ở terratwin-web.
      - key: TERRATWIN_VAPID_PUBLIC_KEY
        sync: false
      - key: TERRATWIN_VAPID_PRIVATE_KEY
        sync: false
      - key: TERRATWIN_CORS
        sync: false                  # điền URL frontend sau khi dựng xong
      # BẮT BUỘC cho vòng lặp một-chạm: link trong tin cảnh báo (/tap/{token})
      # dựng từ đây. Đặt bằng ĐÚNG URL frontend Render cấp (giống TERRATWIN_CORS).
      #
      # QUÊN BIẾN NÀY LÀ HỎNG IM LẶNG: mặc định rơi về http://localhost:3000,
      # nên mọi liên kết gửi tới điện thoại người dùng đều là LINK CHẾT. Tin
      # vẫn gửi thành công, không một dòng lỗi nào trong log, chỉ là không ai
      # bấm được — và kho quan sát thực địa mãi không lớn lên mà không ai hiểu
      # tại sao.
      - key: TERRATWIN_PUBLIC_URL
        sync: false                  # https://terratwin-web.onrender.com
      # Tuỳ chọn — Zalo ZNS, kênh thật của người dùng Việt Nam. Cần giấy phép
      # kinh doanh + mẫu tin được duyệt: nộp hồ sơ SỚM, đó là thời gian lịch
      # 1–2 tuần chứ không phải thời gian làm.
      - key: TERRATWIN_ZALO_TOKEN
        sync: false
      - key: TERRATWIN_ZALO_TEMPLATE_ID
        sync: false
      - key: TERRATWIN_ZALO_PARAM
        value: "content"             # tên tham số trong mẫu tin đã đăng ký
      # Tuỳ chọn — Telegram. Chạy được NGAY, không xét duyệt: nhắn /newbot cho
      # @BotFather. Dùng làm kênh tạm trong lúc chờ Zalo.
      - key: TERRATWIN_TELEGRAM_TOKEN
        sync: false
      # Tuỳ chọn — email SMTP.
      - key: TERRATWIN_SMTP_HOST
        sync: false
      - key: TERRATWIN_SMTP_PORT
        value: "587"
      - key: TERRATWIN_SMTP_USER
        sync: false
      - key: TERRATWIN_SMTP_PASSWORD
        sync: false
      - key: TERRATWIN_SMTP_FROM
        sync: false
      # Tuỳ chọn — bật trợ lý LLM. Nhà cung cấp nào cũng được.
      #
      #   openai-compatible (DeepSeek, Groq, OpenRouter, Together, xAI, Qwen,
      #   Ollama): đặt API_KEY + BASE_URL + MODEL, KHÔNG cần PROVIDER.
      #
      #   Gemini hoặc Anthropic: BẮT BUỘC đặt PROVIDER=gemini|anthropic. Thiếu
      #   nó thì chế độ auto coi khóa là openai-compatible, gửi sai giao thức,
      #   và trợ lý im lặng tụt về rule-based mà không báo lỗi gì.
      - key: TERRATWIN_LLM_PROVIDER
        sync: false
      - key: TERRATWIN_LLM_API_KEY
        sync: false
      - key: TERRATWIN_LLM_BASE_URL
        sync: false
      - key: TERRATWIN_LLM_MODEL
        sync: false
      # Tuỳ chọn — ảnh vệ tinh Sentinel-2 (mở khoá 5 mũi nhọn quang học + C07).
      # Đăng ký miễn phí: https://dataspace.copernicus.eu → Sentinel Hub →
      # OAuth clients → tạo client, lấy ID và secret.
      - key: TERRATWIN_COPERNICUS_ID
        sync: false
      - key: TERRATWIN_COPERNICUS_SECRET
        sync: false

  - type: web
    name: terratwin-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API
        sync: false                  # điền URL của terratwin-api sau khi dựng
      - key: NODE_ENV
        value: production
